<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>社团招新网站 - 高保真原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#3B82F6",
              secondary: "#10B981",
              accent: "#F59E0B",
              dark: "#1E293B",
              light: "#F8FAFC",
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        .content-auto {
          content-visibility: auto;
        }
        .ios-status-bar {
          height: 44px;
          background-color: #fff;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 16px;
          font-size: 14px;
          font-weight: 500;
        }
        .iframe-content {
          width: 100%;
          height: 100vh;
          border: none;
          overflow: hidden;
        }
        .desktop-iframe {
          width: 100%;
          height: calc(100vh - 60px);
          border: none;
          overflow: hidden;
        }
        .web-nav {
          background-color: #fff;
          border-bottom: 1px solid #e5e7eb;
          padding: 0 24px;
          height: 60px;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          z-index: 100;
        }
        .web-nav-container {
          max-width: 1200px;
          margin: 0 auto;
          height: 100%;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .web-nav-brand {
          font-size: 20px;
          font-weight: 700;
          color: #3b82f6;
        }
        .web-nav-links {
          display: flex;
          gap: 24px;
        }
        .web-nav-link {
          color: #1e293b;
          font-weight: 500;
          transition: color 0.2s;
        }
        .web-nav-link:hover {
          color: #3b82f6;
        }
        .web-nav-link.active {
          color: #3b82f6;
        }
        .menu-toggle {
          display: none;
        }

        /* 移动端侧边栏导航样式 */
        .mobile-sidebar {
          position: fixed;
          top: 0;
          right: -80%;
          width: 80%;
          height: 100vh;
          background-color: white;
          box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
          z-index: 1000;
          transition: right 0.3s ease;
          overflow-y: auto;
        }
        .mobile-sidebar.open {
          right: 0;
        }
        .sidebar-backdrop {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100vh;
          background-color: rgba(0, 0, 0, 0.5);
          z-index: 999;
          opacity: 0;
          visibility: hidden;
          transition: opacity 0.3s ease;
        }
        .sidebar-backdrop.visible {
          opacity: 1;
          visibility: visible;
        }
        .mobile-nav-item {
          padding: 16px 24px;
          border-bottom: 1px solid #f0f0f0;
          color: #1e293b;
          font-weight: 500;
          font-size: 16px;
        }
        .mobile-nav-item.active {
          color: #3b82f6;
          background-color: #f0f9ff;
        }

        @media (max-width: 768px) {
          .web-nav-links {
            display: none;
          }
          .menu-toggle {
            display: block;
            font-size: 24px;
            color: #1e293b;
          }
        }
      }
    </style>
  </head>
  <body class="bg-gray-50 overflow-hidden">
    <!-- 桌面端布局 -->
    <div id="desktop-view" class="hidden md:block">
      <!-- 网页导航栏 -->
      <nav class="web-nav">
        <div class="web-nav-container">
          <div class="web-nav-brand">
            <i class="fa fa-code mr-2"></i>智环学创融合协会
          </div>
          <div class="web-nav-links">
            <button
              onclick="showPage('home.html')"
              id="nav-home"
              class="web-nav-link active"
            >
              首页
            </button>
            <button
              onclick="showPage('projects.html')"
              id="nav-projects"
              class="web-nav-link"
            >
              项目库
            </button>
            <button
              onclick="showPage('competitions.html')"
              id="nav-competitions"
              class="web-nav-link"
            >
              竞赛天地
            </button>
            <button
              onclick="showPage('awards.html')"
              id="nav-awards"
              class="web-nav-link"
            >
              奖项库
            </button>
            <button
              onclick="showPage('about.html')"
              id="nav-about"
              class="web-nav-link"
            >
              关于我们
            </button>
            <button
              onclick="showPage('resources.html')"
              id="nav-resources"
              class="web-nav-link"
            >
              资源墙
            </button>
            <button
              onclick="showPage('join.html')"
              id="nav-join"
              class="web-nav-link"
            >
              加入我们
            </button>
          </div>
          <div class="menu-toggle">
            <i class="fa fa-bars"></i>
          </div>
        </div>
      </nav>

      <!-- 主内容区域 -->
      <div style="margin-top: 60px">
        <iframe
          id="desktop-iframe"
          class="desktop-iframe"
          src="home.html"
        ></iframe>
      </div>
    </div>

    <!-- 移动端布局 -->
    <div id="mobile-view" class="md:hidden w-full h-screen">
      <!-- iOS 状态栏 -->
      <div class="ios-status-bar sticky top-0 z-10 bg-white">
        <span>9:41</span>
        <div class="flex items-center gap-1">
          <i class="fa fa-signal"></i>
          <i class="fa fa-wifi"></i>
          <i class="fa fa-battery-three-quarters"></i>
        </div>
      </div>

      <!-- 移动端顶部导航 -->
      <div
        class="bg-white px-4 py-3 shadow-sm sticky top-[44px] z-10 flex items-center justify-between"
      >
        <div class="font-medium text-lg">智环学创融合协会</div>
        <button id="mobile-menu-toggle" class="text-dark">
          <i class="fa fa-bars text-xl"></i>
        </button>
      </div>

      <!-- 内容框架 -->
      <iframe
        id="mobile-iframe"
        class="iframe-content"
        src="home.html"
      ></iframe>
    </div>

    <!-- 移动端侧边栏导航 -->
    <div id="sidebar-backdrop" class="sidebar-backdrop md:hidden"></div>
    <div id="mobile-sidebar" class="mobile-sidebar md:hidden">
      <div class="p-4 border-b flex justify-between items-center">
        <h2 class="text-lg font-bold text-dark">导航菜单</h2>
        <button id="close-sidebar" class="p-2">
          <i class="fa fa-times text-xl"></i>
        </button>
      </div>
      <nav class="py-2">
        <div
          id="mobile-nav-home"
          class="mobile-nav-item active"
          onclick="showPage('home.html')"
        >
          首页
        </div>
        <div
          id="mobile-nav-projects"
          class="mobile-nav-item"
          onclick="showPage('projects.html')"
        >
          项目库
        </div>
        <div
          id="mobile-nav-competitions"
          class="mobile-nav-item"
          onclick="showPage('competitions.html')"
        >
          竞赛天地
        </div>
        <div
          id="mobile-nav-awards"
          class="mobile-nav-item"
          onclick="showPage('awards.html')"
        >
          奖项库
        </div>
        <div
          id="mobile-nav-about"
          class="mobile-nav-item"
          onclick="showPage('about.html')"
        >
          关于我们
        </div>
        <div
          id="mobile-nav-resources"
          class="mobile-nav-item"
          onclick="showPage('resources.html')"
        >
          资源墙
        </div>
        <div
          id="mobile-nav-join"
          class="mobile-nav-item"
          onclick="showPage('join.html')"
        >
          加入我们
        </div>
      </nav>
      <div class="absolute bottom-0 left-0 right-0 p-4 border-t">
        <button
          type="button"
          onclick="showPage('join.html')"
          class="w-full py-3 bg-primary text-white font-bold rounded-lg shadow-md hover:bg-primary/90 transition-colors"
        >
          立即报名
        </button>
      </div>
    </div>

    <script>
      // 页面切换函数
      function showPage(page) {
        // 更新桌面端iframe
        document.getElementById("desktop-iframe").src = page

        // 更新移动端iframe
        document.getElementById("mobile-iframe").src = page

        // 更新桌面端导航高亮
        document.querySelectorAll(".web-nav-link").forEach((item) => {
          item.classList.remove("active")
        })

        const navId = "nav-" + page.split(".")[0]
        const navItem = document.getElementById(navId)
        if (navItem) {
          navItem.classList.add("active")
        }

        // 更新移动端侧边栏导航高亮
        document.querySelectorAll(".mobile-nav-item").forEach((item) => {
          item.classList.remove("active")
        })

        const mobileNavId = "mobile-nav-" + page.split(".")[0]
        const mobileNavItem = document.getElementById(mobileNavId)
        if (mobileNavItem) {
          mobileNavItem.classList.add("active")
        }

        // 关闭移动端侧边栏
        closeSidebar()
      }

      // 移动端侧边栏控制
      function openSidebar() {
        document.getElementById("mobile-sidebar").classList.add("open")
        document.getElementById("sidebar-backdrop").classList.add("visible")
        document.body.style.overflow = "hidden"
      }

      function closeSidebar() {
        document.getElementById("mobile-sidebar").classList.remove("open")
        document.getElementById("sidebar-backdrop").classList.remove("visible")
        document.body.style.overflow = "auto"
      }

      // 模拟当前时间
      function updateTime() {
        const now = new Date()
        const hours = now.getHours().toString().padStart(2, "0")
        const minutes = now.getMinutes().toString().padStart(2, "0")
        document.querySelector(
          ".ios-status-bar span"
        ).textContent = `${hours}:${minutes}`
      }

      // 监听窗口大小变化，切换视图
      function checkScreenSize() {
        const desktopView = document.getElementById("desktop-view")
        const mobileView = document.getElementById("mobile-view")

        if (window.innerWidth >= 768) {
          desktopView.classList.remove("hidden")
          mobileView.classList.add("hidden")
        } else {
          desktopView.classList.add("hidden")
          mobileView.classList.remove("hidden")
        }
      }

      // 初始化
      document.addEventListener("DOMContentLoaded", function () {
        updateTime()
        setInterval(updateTime, 60000)

        checkScreenSize()
        window.addEventListener("resize", checkScreenSize)

        // 侧边栏事件绑定
        document
          .getElementById("mobile-menu-toggle")
          .addEventListener("click", openSidebar)
        document
          .getElementById("close-sidebar")
          .addEventListener("click", closeSidebar)
        document
          .getElementById("sidebar-backdrop")
          .addEventListener("click", closeSidebar)

        // 为了在所有页面中能调用showPage函数
        window.showPage = showPage
      })
    </script>
  </body>
</html>
