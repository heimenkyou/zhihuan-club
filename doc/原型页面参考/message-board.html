<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - 智环学创融合协会</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .animate-slide-up {
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .hover-lift:hover {
            transform: translateY(-2px);
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航 -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <i class="fas fa-code text-primary text-2xl mr-2"></i>
                        <span class="font-bold text-xl text-dark">智环学创融合协会</span>
                    </div>
                    <div class="hidden md:block">
                        <div class="ml-10 flex items-baseline space-x-4">
                            <a href="index.html" class="text-gray-600 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">首页</a>
                            <a href="about.html" class="text-gray-600 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">关于我们</a>
                            <a href="join.html" class="text-gray-600 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">加入我们</a>
                            <a href="message-board.html" class="text-primary px-3 py-2 rounded-md text-sm font-medium">留言板</a>
                            <a href="resources.html" class="text-gray-600 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">资源墙</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 移动端顶部导航 -->
    <div class="md:hidden bg-white shadow-lg">
        <div class="px-4 pt-2 pb-3 space-y-1">
            <a href="index.html" class="text-gray-600 hover:text-primary block px-3 py-2 rounded-md text-base font-medium">首页</a>
            <a href="about.html" class="text-gray-600 hover:text-primary block px-3 py-2 rounded-md text-base font-medium">关于我们</a>
            <a href="join.html" class="text-gray-600 hover:text-primary block px-3 py-2 rounded-md text-base font-medium">加入我们</a>
            <a href="message-board.html" class="text-primary block px-3 py-2 rounded-md text-base font-medium">留言板</a>
            <a href="resources.html" class="text-gray-600 hover:text-primary block px-3 py-2 rounded-md text-base font-medium">资源墙</a>
        </div>
    </div>

    <!-- 主要内容 -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- 页面标题 -->
        <div class="text-center mb-8 animate-slide-up">
            <h1 class="text-3xl font-bold text-gray-900 mb-4">留言板</h1>
            <p class="text-gray-600">在这里留下你的想法、问题或建议</p>
        </div>

        <!-- 发布留言表单 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8 animate-slide-up">
            <h2 class="text-xl font-semibold mb-4">发布留言</h2>
            <form id="messageForm" class="space-y-4">
                <div>
                    <label for="nickname" class="block text-sm font-medium text-gray-700 mb-1">昵称</label>
                    <input type="text" id="nickname" name="nickname" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="请输入您的昵称">
                </div>
                <div>
                    <label for="content" class="block text-sm font-medium text-gray-700 mb-1">留言内容</label>
                    <textarea id="content" name="content" rows="4" required 
                              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                              placeholder="请输入您的留言内容"></textarea>
                </div>
                <button type="submit" 
                        class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition-colors">
                    发布留言
                </button>
            </form>
        </div>

        <!-- 留言列表 -->
        <div class="bg-white rounded-lg shadow-md p-6 animate-slide-up">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">留言列表</h2>
                <span class="text-sm text-gray-500">共 <span id="totalMessages">0</span> 条留言</span>
            </div>
            
            <div id="messageList" class="space-y-4">
                <!-- 留言将通过JavaScript动态加载 -->
            </div>

            <!-- 分页 -->
            <div id="pagination" class="flex justify-center mt-6 space-x-2">
                <!-- 分页按钮将通过JavaScript动态生成 -->
            </div>
        </div>
    </main>

    <script>
        // 模拟留言数据
        let messages = [
            {
                id: 1,
                nickname: "小明",
                content: "这个社团看起来很不错，我想了解一下算法部的具体情况。",
                likes: 5,
                time: "2025-01-15 14:30",
                canDelete: false
            },
            {
                id: 2,
                nickname: "学习爱好者",
                content: "请问项目竞赛部主要参加哪些比赛？有没有学长学姐可以分享一下经验？",
                likes: 8,
                time: "2025-01-15 10:15",
                canDelete: false
            },
            {
                id: 3,
                nickname: "新生小白",
                content: "我是大一新生，没有技术基础，可以加入吗？",
                likes: 12,
                time: "2025-01-14 16:45",
                canDelete: false
            }
        ];

        let currentPage = 1;
        const messagesPerPage = 5;

        // 渲染留言列表
        function renderMessages() {
            const messageList = document.getElementById('messageList');
            const startIndex = (currentPage - 1) * messagesPerPage;
            const endIndex = startIndex + messagesPerPage;
            const currentMessages = messages.slice(startIndex, endIndex);

            messageList.innerHTML = '';

            if (currentMessages.length === 0) {
                messageList.innerHTML = '<div class="text-center text-gray-500 py-8">暂无留言</div>';
                return;
            }

            currentMessages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'border-b border-gray-200 pb-4 last:border-b-0';
                messageDiv.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-medium text-gray-900">${message.nickname}</span>
                                <span class="text-sm text-gray-500">${message.time}</span>
                            </div>
                            <p class="text-gray-700">${message.content}</p>
                        </div>
                        <div class="flex items-center gap-2 ml-4">
                            <button onclick="likeMessage(${message.id})" 
                                    class="flex items-center gap-1 text-sm text-gray-600 hover:text-blue-500">
                                <i class="far fa-thumbs-up"></i>
                                <span>${message.likes}</span>
                            </button>
                            ${message.canDelete ? 
                                `<button onclick="deleteMessage(${message.id})" 
                                         class="text-sm text-red-500 hover:text-red-700">
                                    <i class="far fa-trash-alt"></i>
                                </button>` : ''
                            }
                        </div>
                    </div>
                `;
                messageList.appendChild(messageDiv);
            });

            document.getElementById('totalMessages').textContent = messages.length;
            renderPagination();
        }

        // 渲染分页
        function renderPagination() {
            const totalPages = Math.ceil(messages.length / messagesPerPage);
            const pagination = document.getElementById('pagination');
            
            pagination.innerHTML = '';

            if (totalPages <= 1) return;

            // 上一页
            if (currentPage > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'px-3 py-1 border border-gray-300 rounded hover:bg-gray-50';
                prevBtn.textContent = '上一页';
                prevBtn.onclick = () => changePage(currentPage - 1);
                pagination.appendChild(prevBtn);
            }

            // 页码
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `px-3 py-1 border border-gray-300 rounded ${i === currentPage ? 'bg-blue-500 text-white' : 'hover:bg-gray-50'}`;
                pageBtn.textContent = i;
                pageBtn.onclick = () => changePage(i);
                pagination.appendChild(pageBtn);
            }

            // 下一页
            if (currentPage < totalPages) {
                const nextBtn = document.createElement('button');
                nextBtn.className = 'px-3 py-1 border border-gray-300 rounded hover:bg-gray-50';
                nextBtn.textContent = '下一页';
                nextBtn.onclick = () => changePage(currentPage + 1);
                pagination.appendChild(nextBtn);
            }
        }

        // 切换页面
        function changePage(page) {
            currentPage = page;
            renderMessages();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 点赞留言
        function likeMessage(id) {
            const message = messages.find(m => m.id === id);
            if (message) {
                message.likes++;
                renderMessages();
            }
        }

        // 删除留言
        function deleteMessage(id) {
            if (confirm('确定要删除这条留言吗？')) {
                messages = messages.filter(m => m.id !== id);
                // 如果删除后当前页没有数据，返回上一页
                const totalPages = Math.ceil(messages.length / messagesPerPage);
                if (currentPage > totalPages && totalPages > 0) {
                    currentPage = totalPages;
                }
                renderMessages();
            }
        }

        // 发布留言
        document.getElementById('messageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nickname = document.getElementById('nickname').value;
            const content = document.getElementById('content').value;

            if (!nickname || !content) {
                alert('请填写完整的昵称和留言内容');
                return;
            }

            const newMessage = {
                id: messages.length + 1,
                nickname: nickname,
                content: content,
                likes: 0,
                time: new Date().toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                }),
                canDelete: true
            };

            messages.unshift(newMessage);
            currentPage = 1; // 回到第一页
            renderMessages();
            
            // 清空表单
            this.reset();
            
            alert('留言发布成功！');
        });

        // 初始化
        renderMessages();
    </script>
</body>
</html>
