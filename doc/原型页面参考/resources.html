<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源墙 - 智环学创融合协会</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .animate-slide-up {
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .hover-lift:hover {
            transform: translateY(-2px);
            transition: transform 0.2s ease;
        }
        
        .resource-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .resource-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航 -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <i class="fas fa-code text-primary text-2xl mr-2"></i>
                        <span class="font-bold text-xl text-dark">智环学创融合协会</span>
                    </div>
                    <div class="hidden md:block">
                        <div class="ml-10 flex items-baseline space-x-4">
                            <a href="index.html" class="text-gray-600 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">首页</a>
                            <a href="about.html" class="text-gray-600 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">关于我们</a>
                            <a href="join.html" class="text-gray-600 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">加入我们</a>
                            <a href="message-board.html" class="text-gray-600 hover:text-primary px-3 py-2 rounded-md text-sm font-medium">留言板</a>
                            <a href="resources.html" class="text-primary px-3 py-2 rounded-md text-sm font-medium">资源墙</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 移动端顶部导航 -->
    <div class="md:hidden bg-white shadow-lg">
        <div class="px-4 pt-2 pb-3 space-y-1">
            <a href="index.html" class="text-gray-600 hover:text-primary block px-3 py-2 rounded-md text-base font-medium">首页</a>
            <a href="about.html" class="text-gray-600 hover:text-primary block px-3 py-2 rounded-md text-base font-medium">关于我们</a>
            <a href="join.html" class="text-gray-600 hover:text-primary block px-3 py-2 rounded-md text-base font-medium">加入我们</a>
            <a href="message-board.html" class="text-gray-600 hover:text-primary block px-3 py-2 rounded-md text-base font-medium">留言板</a>
            <a href="resources.html" class="text-primary block px-3 py-2 rounded-md text-base font-medium">资源墙</a>
        </div>
    </div>

    <!-- 主要内容 -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- 页面标题 -->
        <div class="text-center mb-8 animate-slide-up">
            <h1 class="text-3xl font-bold text-gray-900 mb-4">资源墙</h1>
            <p class="text-gray-600">在这里分享和发现优质学习资源</p>
        </div>

        <!-- 筛选和搜索 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8 animate-slide-up">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">资源分类</label>
                    <select id="categoryFilter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">全部分类</option>
                        <option value="algorithm">算法竞赛</option>
                        <option value="project">项目开发</option>
                        <option value="design">设计创作</option>
                        <option value="tool">工具软件</option>
                        <option value="book">书籍资料</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">资源类型</label>
                    <select id="typeFilter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">全部类型</option>
                        <option value="book">书籍</option>
                        <option value="website">网站</option>
                        <option value="video">视频</option>
                        <option value="tool">工具</option>
                        <option value="code">代码</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">搜索资源</label>
                    <input type="text" id="searchInput" placeholder="搜索资源名称..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
        </div>

        <!-- 资源卡片网格 -->
        <div id="resourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 资源卡片将通过JavaScript动态加载 -->
        </div>
    </main>

    <!-- 资源详情模态框 -->
    <div id="resourceModal" class="resource-modal">
        <div class="bg-white rounded-lg p-6 max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-4">
                <h3 id="modalTitle" class="text-xl font-bold"></h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div id="modalContent">
                <!-- 详情内容将通过JavaScript填充 -->
            </div>
        </div>
    </div>

    <script>
        // 模拟资源数据
        const resources = [
            {
                id: 1,
                name: "代码随想录",
                category: "algorithm",
                types: ["book", "website"],
                description: "一本非常优秀的算法学习书籍，配套网站提供丰富的算法题解和学习路线。适合算法竞赛和面试准备。",
                image: "https://via.placeholder.com/300x200/4F46E5/FFFFFF?text=代码随想录",
                link: "https://programmercarl.com",
                author: "Carl"
            },
            {
                id: 2,
                name: "LeetCode",
                category: "algorithm",
                types: ["website"],
                description: "全球知名的算法刷题平台，提供海量算法题目和在线评测系统。适合算法学习和面试准备。",
                image: "https://via.placeholder.com/300x200/10B981/FFFFFF?text=LeetCode",
                link: "https://leetcode.com",
                author: "LeetCode"
            },
            {
                id: 3,
                name: "Python项目实战",
                category: "project",
                types: ["video", "code"],
                description: "通过实际项目学习Python编程，包含Web开发、数据分析、爬虫等多个方向的实战项目。",
                image: "https://via.placeholder.com/300x200/F59E0B/FFFFFF?text=Python项目",
                link: "",
                author: "张老师"
            },
            {
                id: 4,
                name: "算法竞赛入门经典",
                category: "algorithm",
                types: ["book"],
                description: "经典的算法竞赛入门书籍，系统讲解算法竞赛中常用的数据结构和算法。",
                image: "https://via.placeholder.com/300x200/EF4444/FFFFFF?text=算法竞赛入门",
                link: "",
                author: "刘汝佳"
            },
            {
                id: 5,
                name: "GitHub",
                category: "tool",
                types: ["website", "tool"],
                description: "全球最大的代码托管平台，学习版本控制和开源项目协作的必备工具。",
                image: "https://via.placeholder.com/300x200/1F2937/FFFFFF?text=GitHub",
                link: "https://github.com",
                author: "GitHub"
            },
            {
                id: 6,
                name: "VS Code",
                category: "tool",
                types: ["tool"],
                description: "微软开发的免费代码编辑器，支持多种编程语言，拥有丰富的插件生态。",
                image: "https://via.placeholder.com/300x200/007ACC/FFFFFF?text=VS Code",
                link: "https://code.visualstudio.com",
                author: "Microsoft"
            }
        ];

        let filteredResources = [...resources];

        // 渲染资源卡片
        function renderResources() {
            const grid = document.getElementById('resourceGrid');
            grid.innerHTML = '';

            if (filteredResources.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">暂无匹配的资源</div>';
                return;
            }

            filteredResources.forEach(resource => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow cursor-pointer hover-lift';
                card.onclick = () => showResourceDetail(resource);
                
                card.innerHTML = `
                    <img src="${resource.image}" alt="${resource.name}" class="w-full h-48 object-cover rounded-t-lg">
                    <div class="p-4">
                        <h3 class="font-semibold text-lg mb-2 truncate">${resource.name}</h3>
                        <p class="text-gray-600 text-sm line-clamp-2">${resource.description}</p>
                        <div class="mt-3 flex gap-2">
                            ${resource.types.map(type => 
                                `<span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded">${getTypeName(type)}</span>`
                            ).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 获取类型名称
        function getTypeName(type) {
            const typeMap = {
                'book': '书籍',
                'website': '网站',
                'video': '视频',
                'tool': '工具',
                'code': '代码'
            };
            return typeMap[type] || type;
        }

        // 获取分类名称
        function getCategoryName(category) {
            const categoryMap = {
                'algorithm': '算法竞赛',
                'project': '项目开发',
                'design': '设计创作',
                'tool': '工具软件',
                'book': '书籍资料'
            };
            return categoryMap[category] || category;
        }

        // 显示资源详情
        function showResourceDetail(resource) {
            const modal = document.getElementById('resourceModal');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');

            title.textContent = resource.name;
            
            content.innerHTML = `
                <div class="space-y-4">
                    <img src="${resource.image}" alt="${resource.name}" class="w-full h-64 object-cover rounded-lg">
                    
                    <div>
                        <h4 class="font-semibold text-gray-900 mb-2">资源信息</h4>
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <div>
                                <span class="text-gray-600">分类：</span>
                                <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs">${getCategoryName(resource.category)}</span>
                            </div>
                            <div>
                                <span class="text-gray-600">类型：</span>
                                ${resource.types.map(type => 
                                    `<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs mr-1">${getTypeName(type)}</span>`
                                ).join('')}
                            </div>
                            <div>
                                <span class="text-gray-600">作者：</span>
                                <span>${resource.author}</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h4 class="font-semibold text-gray-900 mb-2">资源介绍</h4>
                        <p class="text-gray-700">${resource.description}</p>
                    </div>

                    ${resource.link ? `
                        <div>
                            <a href="${resource.link}" target="_blank" 
                               class="inline-flex items-center px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">
                                <i class="fas fa-external-link-alt mr-2"></i>
                                访问资源
                            </a>
                        </div>
                    ` : ''}
                </div>
            `;

            modal.classList.add('active');
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('resourceModal').classList.remove('active');
        }

        // 筛选资源
        function filterResources() {
            const categoryFilter = document.getElementById('categoryFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            const searchInput = document.getElementById('searchInput').value.toLowerCase();

            filteredResources = resources.filter(resource => {
                const matchesCategory = !categoryFilter || resource.category === categoryFilter;
                const matchesType = !typeFilter || resource.types.includes(typeFilter);
                const matchesSearch = !searchInput || resource.name.toLowerCase().includes(searchInput) || 
                                    resource.description.toLowerCase().includes(searchInput);

                return matchesCategory && matchesType && matchesSearch;
            });

            renderResources();
        }

        // 事件监听
        document.getElementById('categoryFilter').addEventListener('change', filterResources);
        document.getElementById('typeFilter').addEventListener('change', filterResources);
        document.getElementById('searchInput').addEventListener('input', filterResources);

        // 点击模态框外部关闭
        document.getElementById('resourceModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // 初始化
        renderResources();
    </script>
</body>
</html>
