# 自行将该文件复制一份名为 application-dev.yml，并修改数据库与七牛云信息
# 启动项需要添加有效配置文件为dev, 或直接添加JVM参数: -Dspring.profiles.active=dev
app:
  mysql:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${DATABASE_HOST:localhost}
    port: ${DATABASE_PORT:3306}
    database: ${DATABASE_NAME:club}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:2}
  qiniu:
    access-key: ${QINIU_ACCESS_KEY:}
    secret-key: ${QINIU_SECRET_KEY:}
    bucket: club-images-luowb
    domain: https://club-img.luowb.cn
  attachment:
    max-image-size: ${ATTACHMENT_MAX_IMAGE_SIZE:1MB}
  visitor-token:
    secret: ${VISITOR_TOKEN_SECRET:zhihuan-club-visitor-token-secret}
    # 本地 HTTP 调试时关闭 Secure，否则 Cookie 无法持久化
    cookie-secure: ${VISITOR_TOKEN_COOKIE_SECURE:false}
  # 点赞状态保存时长(天)
  like-expire-days: 30
logging:
  level:
    cn.luowb.clubrecruitment.controller: debug
    cn.luowb.clubrecruitment.dao.mapper: debug
    cn.luowb.clubrecruitment.common.util: debug
